  访问统计 - HEAD 段
  此文件内容会在运行时注入到 index.html 的 <head> 中（位于 <!--Google Analytics--> 标记之后）。
  修改本文件后无需重新编译 Go、也无需重新构建前端，重启服务（或等缓存过期）即可生效。

  示例（Umami）：
  <script defer src="https://your-umami.example.com/script.js" data-website-id="YOUR_ID"></script>

  示例（Google Analytics 4）：
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXX"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-XXXXXXX');
  </script>
